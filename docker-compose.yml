services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      WEB_CONCURRENCY: "4"
      REDIS_URL: "redis://redis:6379/0"
      SEARCH_CACHE_TTL: "300"
      SEARCH_CONCURRENCY: "64"
      RATE_LIMIT_PER_MINUTE: "120"
      TRUST_PROXY: "1"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
