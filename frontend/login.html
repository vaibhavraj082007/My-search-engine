<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in – 8search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">8search</div>
    <div class="auth-subtitle">Sign in to your account</div>

    <div id="errorMsg" class="auth-error"></div>

    <form id="loginForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password">
      </div>
      <button type="submit" class="auth-submit">Sign in</button>
    </form>

    <div class="auth-footer">
      Don't have an account? <a href="signup.html">Create one</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('loginForm');
      var errorMsg = document.getElementById('errorMsg');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorMsg.classList.remove('show');

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;

        if (!email || !password) {
          showError('Please enter both email and password.');
          return;
        }

        fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email: email, password: password })
        })
        .then(function (r) {
          if (!r.ok) return r.json().then(function (d) { throw d; });
          return r.json();
        })
        .then(function () {
          window.location.href = '/';
        })
        .catch(function (err) {
          showError(err.message || err.error || 'Invalid email or password.');
        });
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('show');
      }
    })();
  </script>
</body>
</html>
