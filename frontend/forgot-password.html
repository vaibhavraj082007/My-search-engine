<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot password – 8search</title>
  <link rel="stylesheet" href="style.css?v=20261112-3">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo-8">8</span>search</div>
    <div class="auth-subtitle">Reset your password</div>

    <div id="errorMsg" class="auth-error"></div>
    <div id="successMsg" class="auth-success"></div>

    <form id="forgotForm" class="auth-form">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required maxlength="254" placeholder="you@example.com" autocomplete="email">
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Send reset link</button>
    </form>

    <div class="auth-footer">
      Remembered it? <a href="login.html">Back to sign in</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('forgotForm');
      var errorMsg = document.getElementById('errorMsg');
      var successMsg = document.getElementById('successMsg');
      var submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideMessages();

        var email = document.getElementById('email').value.trim();
        if (!email) {
          showError('Please enter your email address.');
          return;
        }

        setLoading(true);
        fetch('/api/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email: email })
        })
        .then(function (r) {
          if (!r.ok) return r.json().then(function (d) { throw d; });
          return r.json();
        })
        .then(function (data) {
          setLoading(false);
          form.style.display = 'none';
          showSuccess(data.message || 'If that account exists, a reset link has been sent.');
        })
        .catch(function (err) {
          setLoading(false);
          showError(messageOf(err, 'Something went wrong. Please try again.'));
        });
      });

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.textContent = loading ? 'Sending…' : 'Send reset link';
      }

      function hideMessages() {
        errorMsg.classList.remove('visible');
        successMsg.classList.remove('visible');
      }

      function showError(msg) {
        successMsg.classList.remove('visible');
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function showSuccess(msg) {
        errorMsg.classList.remove('visible');
        successMsg.textContent = msg;
        successMsg.classList.add('visible');
      }

      function messageOf(err, fallback) {
        var detail = err && (err.detail || err.message || err.error);
        if (Array.isArray(detail)) detail = detail[0] && (detail[0].msg || detail[0].detail);
        return detail || fallback;
      }
    })();
  </script>
</body>
</html>
