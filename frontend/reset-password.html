<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose a new password – 8search</title>
  <link rel="stylesheet" href="style.css?v=20261112-3">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo"><span class="logo-8">8</span>search</div>
    <div class="auth-subtitle">Choose a new password</div>

    <div id="errorMsg" class="auth-error"></div>
    <div id="successMsg" class="auth-success"></div>

    <form id="resetForm" class="auth-form">
      <div class="auth-field">
        <label for="password">New password</label>
        <input type="password" id="password" name="password" required minlength="8" maxlength="72" placeholder="Min 8 characters" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required minlength="8" maxlength="72" placeholder="Re-enter your password" autocomplete="new-password">
      </div>
      <button type="submit" class="auth-submit" id="submitBtn">Update password</button>
    </form>

    <div class="auth-footer">
      <a href="login.html">Back to sign in</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('resetForm');
      var errorMsg = document.getElementById('errorMsg');
      var successMsg = document.getElementById('successMsg');
      var submitBtn = document.getElementById('submitBtn');

      var token = new URLSearchParams(window.location.search).get('token') || '';

      if (!token) {
        form.style.display = 'none';
        showError('This reset link is invalid or incomplete. Request a new one from the "Forgot password?" page.');
      }

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        hideMessages();

        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        if (password.length < 8) {
          showError('Password must be at least 8 characters long.');
          return;
        }

        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }

        setLoading(true);
        fetch('/api/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ token: token, new_password: password })
        })
        .then(function (r) {
          if (!r.ok) return r.json().then(function (d) { throw d; });
          return r.json();
        })
        .then(function (data) {
          setLoading(false);
          form.style.display = 'none';
          showSuccess(data.message || 'Password updated. You can now sign in.');
          setTimeout(function () {
            window.location.href = 'login.html?reset=1';
          }, 1600);
        })
        .catch(function (err) {
          setLoading(false);
          showError(messageOf(err, 'This reset link is invalid or has expired.'));
        });
      });

      function setLoading(loading) {
        submitBtn.disabled = loading;
        submitBtn.textContent = loading ? 'Updating…' : 'Update password';
      }

      function hideMessages() {
        errorMsg.classList.remove('visible');
        successMsg.classList.remove('visible');
      }

      function showError(msg) {
        successMsg.classList.remove('visible');
        errorMsg.textContent = msg;
        errorMsg.classList.add('visible');
      }

      function showSuccess(msg) {
        errorMsg.classList.remove('visible');
        successMsg.textContent = msg;
        successMsg.classList.add('visible');
      }

      function messageOf(err, fallback) {
        var detail = err && (err.detail || err.message || err.error);
        if (Array.isArray(detail)) detail = detail[0] && (detail[0].msg || detail[0].detail);
        return detail || fallback;
      }
    })();
  </script>
</body>
</html>
