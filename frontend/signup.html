<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account – 8search</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">8search</div>
    <div class="auth-subtitle">Create your account</div>

    <div id="errorMsg" class="auth-error"></div>

    <form id="signupForm">
      <div class="auth-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="auth-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="Min 8 characters" minlength="8" autocomplete="new-password">
      </div>
      <div class="auth-field">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Re-enter your password" autocomplete="new-password">
      </div>
      <button type="submit" class="auth-submit">Create account</button>
    </form>

    <div class="auth-footer">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script>
    (function () {
      'use strict';

      var form = document.getElementById('signupForm');
      var errorMsg = document.getElementById('errorMsg');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errorMsg.classList.remove('show');

        var email = document.getElementById('email').value.trim();
        var password = document.getElementById('password').value;
        var confirmPassword = document.getElementById('confirmPassword').value;

        if (!email || !password || !confirmPassword) {
          showError('Please fill in all fields.');
          return;
        }

        if (password.length < 8) {
          showError('Password must be at least 8 characters long.');
          return;
        }

        if (password !== confirmPassword) {
          showError('Passwords do not match.');
          return;
        }

        fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'same-origin',
          body: JSON.stringify({ email: email, password: password })
        })
        .then(function (r) {
          if (!r.ok) return r.json().then(function (d) { throw d; });
          return r.json();
        })
        .then(function () {
          window.location.href = 'login.html';
        })
        .catch(function (err) {
          showError(err.message || err.error || 'Failed to create account. Please try again.');
        });
      });

      function showError(msg) {
        errorMsg.textContent = msg;
        errorMsg.classList.add('show');
      }
    })();
  </script>
</body>
</html>
